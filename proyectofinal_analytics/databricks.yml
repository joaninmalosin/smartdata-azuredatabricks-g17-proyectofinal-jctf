# This is a Declarative Automation Bundle definition for proyectofinal_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: proyectofinal_analytics
  uuid: 4ddd9a12-0e89-448b-9876-cf8f10cd8ce5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema_bronze:
    description: Esquema para la capa inicial de datos
  schema_silver:
    description: Esquema para los datos limpios y conformados
  schema_golden:
    description: Esquema para los datos agregados de negocio
  warehouse_id:
    description: SQL warehouse que ejecuta las consultas del dashboard
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405613338755254.14.azuredatabricks.net
    variables:
      catalog: catalog_dev
      schema_bronze: bronze
      schema_silver: silver
      schema_golden: golden
      warehouse_id: de88a6bd5527f754
  prod:
    mode: production
    workspace:
      host: https://adb-7405605547244545.5.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/joancarlotorresflores@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/joancarlotorresflores@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: catalog_prod
      schema_bronze: bronze
      schema_silver: silver
      schema_golden: golden
      warehouse_id: 6908f6bbe53cff61
    permissions:
      - user_name: joancarlotorresflores@gmail.com
        level: CAN_MANAGE
